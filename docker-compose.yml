# Postgres lokal untuk pengembangan (dipakai packages/database).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports:
      - "5432:5432"
    volumes:
      - workflow-db:/var/lib/postgresql/data
volumes:
  workflow-db:
